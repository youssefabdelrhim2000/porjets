<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>قطاع الأمن المركزي - قسم التحريات</title>
    <meta name="description" content="نظام إدارة الدفاتر الرقمية لقطاع الأمن المركزي" />
    <meta name="author" content="قطاع الأمن المركزي" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <!-- الثيم يتطبق قبل React عشان نمنع الوميض الأبيض -->
    <script>
      (function () {
        try {
          var t = localStorage.getItem('app_global_theme_fallback') || 'dark';
          document.documentElement.classList.add(t === 'light' ? 'light' : 'dark');
        } catch (e) {
          document.documentElement.classList.add('dark');
        }
      })();
    </script>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
